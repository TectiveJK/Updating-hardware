<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e1a24">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Hardware</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #0e1a24;
      --bg-2: #162636;
      --card: #1c3347;
      --line: #2b4a63;
      --text: #f3f7fb;
      --muted: #9db0c0;
      --accent: #3ecf8e;
      --accent-2: #2bb673;
      --warn: #f0b429;
      --danger: #ef6b6b;
      --tap: 48px;
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .screen { min-height: 100dvh; display: flex; flex-direction: column; }
    header.app {
      position: sticky; top: 0; z-index: 5;
      background: linear-gradient(#0e1a24, #0e1a24ee);
      padding: 14px 16px 10px;
    }
    header.app h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; }
    .banner {
      margin: 0 16px 10px;
      padding: 10px 12px;
      background: #3a3318;
      color: #ffe9a8;
      border-radius: 10px;
      font-size: 13px;
    }
    .search {
      width: 100%;
      min-height: var(--tap);
      border: 1px solid var(--line);
      background: var(--bg-2);
      border-radius: 12px;
      padding: 0 14px;
      outline: none;
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px 4px;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg-2);
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #062016; font-weight: 700; }
    .list { padding: 8px 12px 96px; display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; flex-direction: column; align-items: flex-start; text-align: left;
      width: 100%; min-height: 64px;
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 12px 14px;
    }
    .item b { font-size: 16px; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .loc { color: var(--accent); font-weight: 600; }
    .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
    .gate {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 24px 20px 40px; max-width: 420px; width: 100%; margin: 0 auto;
    }
    .gate h1 { font-size: 28px; margin: 0 0 8px; }
    .gate p { color: var(--muted); margin: 0 0 12px; }
    .google-signin { margin: 18px 0; min-height: 44px; display: flex; justify-content: center; }
    .user-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin: 0 0 8px;
    }
    .user-row .sub { margin: 0; }
    .btn {
      min-height: var(--tap);
      border: 0; border-radius: 12px;
      background: var(--accent); color: #062016; font-weight: 700;
      padding: 0 16px; width: 100%;
    }
    .btn.secondary { background: var(--bg-2); color: var(--text); border: 1px solid var(--line); }
    .btn.danger {
      background: #3a1c1c;
      color: #ffc4c4;
      border: 1px solid var(--danger);
    }
    .btn.small {
      width: auto;
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 12px;
      font-size: 13px;
    }
    .btn:disabled { opacity: 0.55; }
    .name-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin: 4px 0 8px;
    }
    .name-row h2 {
      flex: 0 1 auto;
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }
    .field { margin: 12px 0; }
    .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    .sheet {
      position: fixed; inset: 0; background: #0008; z-index: 10;
      display: flex; align-items: flex-end;
    }
    .sheet .panel {
      width: 100%; max-height: 92dvh; overflow: auto;
      background: var(--bg-2);
      border-radius: 20px 20px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .grab { width: 42px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 12px; }
    .locs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .loc-btn {
      min-height: 52px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card);
    }
    .loc-btn.on { border-color: var(--accent); background: #16382c; color: var(--accent); font-weight: 700; }
    textarea, input.box, select.box {
      width: 100%; border: 1px solid var(--line); background: var(--bg);
      border-radius: 12px; padding: 12px; outline: none;
    }
    select.box { min-height: var(--tap); }
    option { background: var(--bg); color: var(--text); }
    textarea { min-height: 72px; resize: vertical; }
    .toast {
      position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom));
      background: #123; border: 1px solid var(--accent); color: var(--text);
      padding: 12px 14px; border-radius: 12px; z-index: 20; text-align: center;
    }
    .add-btn {
      position: fixed; left: 16px; right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 6;
    }
    .err { color: var(--danger); font-size: 14px; min-height: 1.2em; }
    .type { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  </style>
</head>

  <script>
    if (!window.TectiveHardwareShare) {
      (function (root) {
        var KEY = 'tective-shared-hardware-v1';
        var CHANNEL = 'tective-hardware-locations';
        var channel = null;
        function read() {
          try {
            var raw = root.localStorage.getItem(KEY);
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (!parsed || parsed.kind !== 'tective-shared-hardware' || !Array.isArray(parsed.items)) return null;
            return parsed;
          } catch (err) { return null; }
        }
        function write(items, source) {
          var payload = {
            kind: 'tective-shared-hardware',
            v: 1,
            updatedAt: new Date().toISOString(),
            source: source || 'locator',
            items: items || []
          };
          try { root.localStorage.setItem(KEY, JSON.stringify(payload)); } catch (err) {}
          try {
            if (!channel) channel = new root.BroadcastChannel(CHANNEL);
            channel.postMessage(payload);
          } catch (err) {}
          return payload;
        }
        function listen(onItems) {
          function handle(parsed) {
            if (parsed && parsed.kind === 'tective-shared-hardware' && Array.isArray(parsed.items)) onItems(parsed.items, parsed);
          }
          root.addEventListener('storage', function (event) {
            if (event.key !== KEY || !event.newValue) return;
            try { handle(JSON.parse(event.newValue)); } catch (err) {}
          });
          try {
            channel = new root.BroadcastChannel(CHANNEL);
            channel.onmessage = function (event) { handle(event.data); };
          } catch (err) {}
        }
        root.TectiveHardwareShare = { KEY: KEY, CHANNEL: CHANNEL, read: read, write: write, listen: listen };
      })(window);
    }
  </script>
  <script>
    const LOCATIONS = [

      { name: 'battery 97 (004)', location: 'In factory downstairs', person: '', note: '', gimbal: '', type: 'battery' },
      { name: 'battery 118', location: 'In factory downstairs', person: '', note: '', gimbal: '', type: 'battery' },
      { name: 'battery 82', location: 'In factory downstairs', person: '', note: '', gimbal: '', type: 'battery' },
      { name: 'battery 93', location: 'Out of service', person: '', note: '', gimbal: '', type: 'battery' },
      { name: 'battery 86', location: 'In factory downstairs', person: '', note: '', gimbal: '', type: 'battery' },
      { name: 'battery 43', location: 'testing', person: '', note: 'Battery port flight testing with drone 32', gimbal: '', type: 'battery' },
      { name: 'battery 17', location: 'Out of service', person: '', note: '', gimbal: '', type: 'battery' },
      { name: 'battery 62', location: 'In factory downstairs', person: '', note: '', gimbal: '', type: 'battery' },
      { name: 'rotator 25', location: 'In factory downstairs', person: '', note: 'without dish and antenna cone', gimbal: '', type: 'rotator' },
      { name: 'GCS-001', location: 'In office upstairs', person: '', note: '', gimbal: '', type: 'gcs' },
      { name: 'GCS-004', location: 'In factory downstairs', person: '', note: '', gimbal: '', type: 'gcs' },

    ];

    const STORE_KEY = 'hw_items';
    const SHARE = window.TectiveHardwareShare;
    const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3KiLyly5nRN7-y9iyJvL-z6xLpJKtNH02faJ4NeH1j0BvYUhlbvUVOXqckLtIIGqcuw/exec';
    const AUTH_KEY = 'hw_sso';
    const state = {
      name: localStorage.getItem('hw_name') || '',
      items: [],
      query: '',
      filter: 'all',
      selected: null,
      customLocation: '',
      error: '',
      loading: false,
      toast: '',
      shared: false,
      editingName: false,
      user: null
    };

    function $(tag, attrs, kids) {
      const n = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => {
        if (k === 'class') n.className = v;
        else if (k === 'on') Object.entries(v).forEach(([ev, fn]) => n.addEventListener(ev, fn));
        else if (k === 'text') n.textContent = v;
        else if (v === true) n.setAttribute(k, '');
        else if (v !== false && v != null) n.setAttribute(k, v);
      });
      (kids || []).forEach((c) => { if (c) n.appendChild(c); });
      return n;
    }

    function scriptUrl() {
      const url = (window.HARDWARE_CONFIG && window.HARDWARE_CONFIG.scriptUrl) || DEFAULT_SCRIPT_URL;
      if (!url || url.indexOf('PASTE_') !== -1) return '';
      return url;
    }

    function inAppsScript() {
      return !!(window.google && google.script && google.script.run);
    }

    function isShared() {
      return inAppsScript() || !!scriptUrl();
    }

    function googleClientId() {
      return String((window.HARDWARE_CONFIG && window.HARDWARE_CONFIG.googleClientId) || '').trim();
    }

    function allowedEmailDomains() {
      const fromConfig = window.HARDWARE_CONFIG && window.HARDWARE_CONFIG.allowedEmailDomains;
      if (Array.isArray(fromConfig) && fromConfig.length) {
        return fromConfig.map((d) => String(d || '').toLowerCase()).filter(Boolean);
      }
      return ['tective.nl'];
    }

    function ssoEnabled() {
      return !!googleClientId();
    }

    function emailDomain(email) {
      const parts = String(email || '').toLowerCase().split('@');
      return parts.length === 2 ? parts[1] : '';
    }

    function isAllowedEmail(email, domains) {
      const allowed = (domains && domains.length) ? domains : allowedEmailDomains();
      const domain = emailDomain(email);
      return !!domain && allowed.indexOf(domain) !== -1;
    }

    function decodeJwtPayload(token) {
      try {
        const part = String(token || '').split('.')[1];
        if (!part) return null;
        const padded = part.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((part.length + 3) % 4);
        return JSON.parse(decodeURIComponent(atob(padded).split('').map((c) => {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join('')));
      } catch (err) {
        return null;
      }
    }

    function sessionFromIdToken(token) {
      const payload = decodeJwtPayload(token);
      if (!payload || !payload.email) return null;
      return {
        idToken: token,
        email: String(payload.email || '').toLowerCase(),
        name: payload.name || payload.given_name || '',
        exp: Number(payload.exp || 0) * 1000
      };
    }

    function readSession() {
      try {
        const raw = localStorage.getItem(AUTH_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !parsed.idToken) return null;
        return parsed;
      } catch (err) {
        return null;
      }
    }

    function saveSession(session) {
      state.user = session;
      try { localStorage.setItem(AUTH_KEY, JSON.stringify(session)); } catch (err) {}
    }

    function clearSession() {
      state.user = null;
      try { localStorage.removeItem(AUTH_KEY); } catch (err) {}
    }

    function hasValidSession() {
      const session = state.user || readSession();
      if (!session || !session.idToken) return false;
      if (session.exp && Date.now() > session.exp - 60000) {
        clearSession();
        return false;
      }
      if (!isAllowedEmail(session.email)) {
        clearSession();
        return false;
      }
      state.user = session;
      if (session.name && !state.name) {
        state.name = session.name;
        localStorage.setItem('hw_name', session.name);
      }
      return true;
    }

    function loadGis(onReady) {
      if (window.google && google.accounts && google.accounts.id) {
        onReady();
        return;
      }
      const existing = document.querySelector('script[src="https://accounts.google.com/gsi/client"]');
      if (existing) {
        existing.addEventListener('load', onReady);
        return;
      }
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = onReady;
      s.onerror = function () {
        state.error = 'Could not load Google sign-in.';
        render();
      };
      document.head.appendChild(s);
    }

    function onGoogleCredential(response) {
      const session = sessionFromIdToken(response && response.credential);
      if (!session) {
        state.error = 'Could not read the Google sign-in.';
        render();
        return;
      }
      if (!isAllowedEmail(session.email)) {
        clearSession();
        state.error = 'Use your Tective Google account (@' + allowedEmailDomains().join(', @') + ').';
        render();
        return;
      }
      saveSession(session);
      state.name = session.name || session.email;
      localStorage.setItem('hw_name', state.name);
      state.error = '';
      bootApp();
    }

    function mountGoogleButton() {
      loadGis(function () {
        const el = document.getElementById('google-signin');
        if (!el || !window.google || !google.accounts || !google.accounts.id) return;
        google.accounts.id.initialize({
          client_id: googleClientId(),
          callback: onGoogleCredential,
          auto_select: true,
          cancel_on_tap_outside: false,
          itp_support: true,
          use_fedcm_for_prompt: true,
          hd: allowedEmailDomains()[0]
        });
        google.accounts.id.renderButton(el, {
          type: 'standard',
          theme: 'filled_black',
          size: 'large',
          text: 'signin_with',
          shape: 'pill',
          width: 320
        });
        try { google.accounts.id.prompt(); } catch (err) {}
      });
    }

    function signOut() {
      clearSession();
      state.items = [];
      state.selected = null;
      state.error = '';
      try {
        if (window.google && google.accounts && google.accounts.id) {
          google.accounts.id.disableAutoSelect();
        }
      } catch (err) {}
      render();
    }

    function renderGate() {
      return $('div', { class: 'screen' }, [
        $('div', { class: 'gate' }, [
          $('h1', { text: 'Hardware' }),
          $('p', { text: 'Sign in with your Tective Google account to open the company list.' }),
          $('div', { id: 'google-signin', class: 'google-signin' }),
          $('p', { class: 'err', text: state.error }),
          $('p', { text: 'Only @' + allowedEmailDomains().join(', @') + ' accounts can sign in.' })
        ])
      ]);
    }

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return STARTING_ITEMS.map((it) => Object.assign({}, it));
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || !parsed.length) {
          return STARTING_ITEMS.map((it) => Object.assign({}, it));
        }
        return parsed;
      } catch (err) {
        return STARTING_ITEMS.map((it) => Object.assign({}, it));
      }
    }

    function saveStore(items) {
      localStorage.setItem(STORE_KEY, JSON.stringify(items));
    }

    function classify(name) {
      const n = String(name || '').toLowerCase();
      if (n.indexOf('gcs') !== -1) return 'gcs';
      if (n.indexOf('battery') !== -1) return 'battery';
      if (n.indexOf('rotator') !== -1) return 'rotator';
      if (n.indexOf('gimbal') !== -1) return 'gimbal';
      if (n.indexOf('hive') !== -1 || n.indexOf('skyfence') !== -1) return 'hive';
      if (n.indexOf('refly') !== -1 || n.indexOf('drone') !== -1 || n.indexOf('ibb') !== -1) return 'drone';
      return 'other';
    }

    function isGimbalName(name) {
      return classify(name) === 'gimbal';
    }

    function droneNames() {
      return state.items
        .filter((it) => classify(it.name) === 'drone')
        .map((it) => it.name)
        .sort((a, b) => String(a).toLowerCase().localeCompare(String(b).toLowerCase()));
    }

    function gimbalsForDrone(droneName) {
      const wanted = String(droneName || '').trim().toLowerCase();
      if (!wanted) return [];
      return state.items.filter((it) => isGimbalName(it.name) && attachedDrone(it).toLowerCase() === wanted);
    }

    function isDroneGimbalStatus(value) {
      const v = String(value || '').trim().toLowerCase();
      return v === 'on drone' || v === 'removed';
    }

    function attachedDroneFromNote(note) {
      const line = String(note || '').split('\n')[0] || '';
      const match = line.match(/^Attached to:\s*(.+?)\s*$/i);
      return match ? String(match[1] || '').trim() : '';
    }

    function noteWithoutAttachment(note) {
      const lines = String(note || '').split('\n');
      if (!/^Attached to:\s*/i.test(lines[0] || '')) return String(note || '');
      lines.shift();
      if (lines[0] === '') lines.shift();
      return lines.join('\n');
    }

    function noteWithAttachment(note, drone) {
      const body = noteWithoutAttachment(note);
      const name = String(drone || '').trim();
      if (!name || isDroneGimbalStatus(name)) return body;
      return body ? ('Attached to: ' + name + '\n' + body) : ('Attached to: ' + name);
    }

    function attachedDrone(item) {
      if (!item || classify(item.name) !== 'gimbal') return '';
      const fromField = String(item.gimbal || '').trim();
      if (fromField && !isDroneGimbalStatus(fromField)) return fromField;
      return attachedDroneFromNote(item.note);
    }

    function itemHeading(item) {
      const drone = attachedDrone(item);
      if (!drone) return item.name;
      return item.name + ' attached to ' + drone;
    }

    function isDeletedItem(it) {
      return String((it && it.location) || '').trim().toLowerCase() === 'deleted';
    }

    function visibleItems(items) {
      return (items || []).filter((it) => !isDeletedItem(it)).map((it) => {
        const item = Object.assign({}, it);
        item.type = classify(item.name);
        if (item.type === 'gimbal') {
          const drone = attachedDrone(item);
          if (drone) item.gimbal = drone;
        }
        return item;
      });
    }

    function localApi(action, params) {
      const items = loadStore();
      if (action === 'list') return Promise.resolve({ ok: true, items: items });
      if (action === 'add') {
        const name = String(params.item || '').trim();
        if (!name) return Promise.resolve({ ok: false, error: 'Type a hardware name.' });
        if (items.some((it) => it.name.toLowerCase() === name.toLowerCase())) {
          return Promise.resolve({ ok: false, error: name + ' is already on the list.' });
        }
        const item = {
          name: name,
          location: params.location,
          person: params.person || '',
          note: params.note || '',
          gimbal: params.gimbal || '',
          type: classify(name)
        };
        items.push(item);
        saveStore(items);
        return Promise.resolve({ ok: true, item: Object.assign({}, item) });
      }
      if (action === 'delete') {
        const idx = items.findIndex((it) => it.name.toLowerCase() === String(params.item).toLowerCase());
        if (idx === -1) return Promise.resolve({ ok: false, error: 'Item not found.' });
        const deleted = items[idx].name;
        items.splice(idx, 1);
        saveStore(items);
        return Promise.resolve({ ok: true, deleted: deleted });
      }
      const item = items.find((it) => it.name.toLowerCase() === String(params.item).toLowerCase());
      if (!item) return Promise.resolve({ ok: false, error: 'Item not found.' });
      const newName = String(params.newName || '').trim();
      if (newName && newName.toLowerCase() !== item.name.toLowerCase()) {
        if (items.some((it) => it.name.toLowerCase() === newName.toLowerCase())) {
          return Promise.resolve({ ok: false, error: newName + ' is already on the list.' });
        }
        item.name = newName;
        item.type = classify(newName);
      }
      item.location = params.location;
      item.person = params.person;
      item.note = params.note;
      if (params.gimbal != null) item.gimbal = params.gimbal;
      saveStore(items);
      return Promise.resolve({ ok: true, item: Object.assign({}, item) });
    }

    function jsonp(action, params, allowCookies) {
      return new Promise((resolve, reject) => {
        const cb = 'hwcb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const qs = new URLSearchParams({ action: action, callback: cb, t: String(Date.now()) });
        Object.keys(params).forEach((k) => {
          if (params[k] != null) qs.set(k, params[k]);
        });
        const s = document.createElement('script');
        s.async = true;
        s.referrerPolicy = 'no-referrer';
        if (!allowCookies) s.crossOrigin = 'anonymous';
        let settled = false;
        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Timed out talking to the company list.'));
        }, 20000);
        function cleanup() {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          delete window[cb];
          s.remove();
        }
        window[cb] = (data) => { cleanup(); resolve(data); };
        s.onerror = () => { cleanup(); reject(new Error('Could not reach the company list.')); };
        s.src = scriptUrl() + (scriptUrl().indexOf('?') === -1 ? '?' : '&') + qs.toString();
        document.body.appendChild(s);
      });
    }

    function callApi(action, params) {
      params = params || {};
      if (state.user && state.user.idToken) params.idToken = state.user.idToken;
      if (scriptUrl()) {
        return jsonp(action, params, false).catch(function (err) {
          return jsonp(action, params, true).catch(function () { throw err; });
        }).then(function (res) {
          if (res && res.ok === false && /sign in/i.test(String(res.error || ''))) {
            clearSession();
            render();
          }
          return res;
        });
      }
      if (inAppsScript()) {
        return new Promise((resolve, reject) => {
          const run = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
          if (action === 'list') run.listItems(params);
          else if (action === 'add') run.addItem(params);
          else if (action === 'delete') run.deleteItem(params);
          else run.updateItem(params);
        });
      }
      return localApi(action, params);
    }

    function wantedItem() {
      const q = new URLSearchParams(location.search).get('item');
      return q ? q.trim() : '';
    }

    function filtered() {
      const q = state.query.trim().toLowerCase();
      return state.items.filter((it) => {
        if (state.filter !== 'all' && classify(it.name) !== state.filter) return false;
        if (!q) return true;
        return [it.name, it.location, it.person, it.note, it.gimbal].join(' ').toLowerCase().indexOf(q) !== -1;
      });
    }

    function toast(msg) {
      state.toast = msg;
      render();
      setTimeout(() => { if (state.toast === msg) { state.toast = ''; render(); } }, 2200);
    }

    async function loadItems(openName, silent) {
      if (ssoEnabled() && !hasValidSession()) {
        if (!silent) render();
        return;
      }
      if (state.selected && silent) return;
      if (!silent) {
        state.loading = true;
        state.error = '';
        render();
      }
      try {
        const res = await callApi('list', {});
        if (!res || res.ok === false) throw new Error((res && res.error) || 'Could not load items.');
        const next = visibleItems(res.items || []);
        const changed = JSON.stringify(state.items) !== JSON.stringify(next);
        state.items = next;
        state.shared = isShared();
        if (SHARE && SHARE.write) SHARE.write(next, 'locator');
        const target = openName || (!silent && wantedItem());
        if (target) {
          const found = state.items.find((it) => it.name.toLowerCase() === target.toLowerCase());
          if (found) openEditor(found);
        } else if (!silent || changed) {
          render();
        }
      } catch (err) {
        const shared = SHARE && SHARE.read ? SHARE.read() : null;
        const sharedItems = shared && Array.isArray(shared.items) ? visibleItems(shared.items) : [];
        if (sharedItems.length && (!state.items.length || silent)) {
          state.items = sharedItems;
          state.shared = true;
          if (!silent) state.error = '';
          render();
        } else if (!silent) {
          state.error = (err && err.message) || String(err);
          if (!state.items.length) {
            state.error = 'Could not load hardware. You do not need a Google login. Check the connection and tap Retry.';
          }
          render();
        }
      } finally {
        if (!silent) {
          state.loading = false;
          render();
        }
      }
    }

    function openAdd() {
      state.selected = {
        isNew: true,
        name: '',
        location: '',
        person: state.name || (state.user && (state.user.name || state.user.email)) || '',
        note: '',
        gimbal: '',
        type: 'other'
      };
      state.customLocation = '';
      state.editingName = true;
      state.error = '';
      render();
    }

    function openEditor(item) {
      state.selected = Object.assign({ originalName: item.name }, item);
      state.customLocation = LOCATIONS.indexOf(item.location) === -1 ? item.location : '';
      if (!state.selected.person && state.name) state.selected.person = state.name;
      if (isGimbalName(item.name)) {
        const drone = attachedDrone(item);
        if (drone) state.selected.gimbal = drone;
        state.selected.note = noteWithoutAttachment(item.note);
      }
      state.editingName = false;
      state.error = '';
      render();
    }

    function closeEditor() {
      state.selected = null;
      state.editingName = false;
      render();
    }

    async function save() {
      const item = state.selected;
      if (!item) return;
      const nameEl = document.querySelector('input[placeholder^="e.g."]');
      const personEl = document.querySelector('input[placeholder="Your name"]');
      const noteEl = document.querySelector('textarea[placeholder="Optional note"]');
      const otherEl = document.querySelector('input[placeholder="Other location"]');
      const droneEl = document.querySelector('select[data-field="belongs-to-drone"]');
      const droneOtherEl = document.querySelector('input[data-field="belongs-to-drone-other"]');
      if (nameEl) item.name = nameEl.value;
      if (personEl) item.person = personEl.value;
      if (noteEl) item.note = noteEl.value;
      if (otherEl && otherEl.value.trim() && LOCATIONS.indexOf(item.location) === -1) {
        item.location = otherEl.value.trim();
      }
      if (isGimbalName(item.name)) {
        const typedDrone = droneOtherEl && droneOtherEl.value.trim();
        item.gimbal = typedDrone || (droneEl && droneEl.value) || '';
      }
      const hardwareName = (item.name || '').trim();
      if (!hardwareName) { state.error = 'Type a hardware name.'; render(); return; }
      const location = (item.location || '').trim();
      if (!location) { state.error = 'Choose a location.'; render(); return; }
      state.loading = true;
      state.error = '';
      render();
      try {
        const adding = !!item.isNew;
        const originalName = (item.originalName || hardwareName).trim();
        const renamed = !adding && hardwareName.toLowerCase() !== originalName.toLowerCase();
        const payload = {
          item: adding ? hardwareName : originalName,
          newName: renamed ? hardwareName : '',
          location: location,
          person: item.person || '',
          note: item.note || ''
        };
        if (isGimbalName(hardwareName)) {
          payload.gimbal = item.gimbal || '';
          payload.setGimbal = '1';
          payload.note = noteWithAttachment(item.note, item.gimbal);
        }
        const res = await callApi(adding ? 'add' : 'update', payload);
        if (!res || res.ok === false) throw new Error((res && res.error) || 'Save failed.');
        localStorage.setItem('hw_name', item.person || '');
        state.name = item.person || '';
        const saved = Object.assign({ isNew: false }, res.item || item, { name: hardwareName });
        if (isGimbalName(hardwareName)) {
          saved.gimbal = item.gimbal || attachedDrone(saved);
          saved.note = payload.note;
          saved.type = 'gimbal';
        }
        const lookFor = originalName.toLowerCase();
        const idx = state.items.findIndex((it) => it.name.toLowerCase() === lookFor || it.name.toLowerCase() === hardwareName.toLowerCase());
        if (idx !== -1) state.items[idx] = saved;
        else state.items.unshift(saved);
        if (SHARE && SHARE.write) SHARE.write(visibleItems(state.items), 'locator');
        state.selected = null;
        state.editingName = false;
        toast(adding ? 'Added ' + hardwareName : (renamed ? 'Renamed to ' + hardwareName : 'Updated ' + hardwareName));
      } catch (err) {
        state.error = err.message || String(err);
      } finally {
        state.loading = false;
        render();
      }
    }

    async function removeItem() {
      const item = state.selected;
      if (!item || item.isNew) return;
      const hardwareName = (item.originalName || item.name || '').trim();
      if (!hardwareName) return;
      if (!window.confirm('Delete ' + hardwareName + ' from the company list?')) return;
      state.loading = true;
      state.error = '';
      render();
      try {
        // The live Google script only knows list/update/add. Do not call action=delete.
        const res = await callApi('update', {
          item: hardwareName,
          location: 'Deleted',
          person: '',
          note: 'Deleted from the hardware list'
        });
        if (!res || res.ok === false) throw new Error((res && res.error) || 'Delete failed.');
        state.items = state.items.filter((it) => it.name.toLowerCase() !== hardwareName.toLowerCase());
        if (SHARE && SHARE.write) SHARE.write(visibleItems(state.items), 'locator');
        state.selected = null;
        state.editingName = false;
        toast('Deleted ' + hardwareName);
      } catch (err) {
        state.error = err.message || String(err);
      } finally {
        state.loading = false;
        render();
      }
    }

    function renderList() {
      const search = $('input', {
        class: 'search', type: 'search', placeholder: 'Search hardware…',
        value: state.query, enterkeyhint: 'search'
      });
      search.addEventListener('input', () => {
        state.query = search.value;
        const start = search.selectionStart;
        render();
        const next = document.querySelector('input[type="search"]');
        if (next) { next.focus(); next.setSelectionRange(start, start); }
      });

      const items = filtered();
      return $('div', { class: 'screen' }, [
        $('header', { class: 'app' }, [
          $('h1', { text: 'Hardware' }),
          $('div', { class: 'user-row' }, [
            $('div', { class: 'sub', text: state.loading ? 'Loading…' : items.length + ' items' }),
            state.user ? $('button', {
              class: 'btn secondary small',
              type: 'button',
              on: { click: signOut }
            }, [$('span', { text: 'Sign out' })]) : null
          ]),
          state.user ? $('div', { class: 'sub', text: state.user.name || state.user.email }) : null,
          $('div', { class: 'field' }, [search])
        ]),
        state.error ? $('div', { class: 'banner' }, [
          $('div', { text: state.error }),
          $('button', {
            class: 'btn secondary',
            type: 'button',
            style: 'margin-top:8px',
            on: { click: () => loadItems() }
          }, [$('span', { text: 'Retry' })])
        ]) : null,
        $('div', { class: 'filters' }, FILTERS.map((f) =>
          $('button', {
            class: 'chip' + (state.filter === f.id ? ' on' : ''),
            on: { click: () => { state.filter = f.id; render(); } }
          }, [$('span', { text: f.label })])
        )),
        $('div', { class: 'list' }, items.length ? items.map((it) =>
          $('button', { class: 'item', on: { click: () => openEditor(it) } }, [
            $('div', { class: 'type', text: it.type }),
            $('b', { text: itemHeading(it) }),
            $('div', { class: 'meta' }, [
              $('span', { class: 'loc', text: it.location || 'No location' }),
              $('span', { text: it.person ? ' · ' + it.person : '' })
            ])
          ])
        ) : [$('div', { class: 'empty', text: state.loading ? 'Loading…' : (state.error ? 'Hardware did not load.' : 'No matching hardware.') })]),
        $('button', {
          class: 'btn add-btn',
          type: 'button',
          on: { click: openAdd }
        }, [$('span', { text: 'Add hardware' })])
      ]);
    }

    function renderDronePicker(item) {
      const drones = droneNames();
      const assigned = String(item.gimbal || '').trim();
      const known = drones.indexOf(assigned) !== -1;
      const select = $('select', { class: 'box', 'data-field': 'belongs-to-drone' });
      select.appendChild($('option', { value: '', text: 'Not assigned' }));
      drones.forEach((name) => {
        select.appendChild($('option', { value: name, text: name }));
      });
      select.value = known ? assigned : '';
      select.addEventListener('change', () => {
        item.gimbal = select.value;
        const other = document.querySelector('input[data-field="belongs-to-drone-other"]');
        if (other && select.value) other.value = '';
      });
      const other = $('input', {
        class: 'box',
        'data-field': 'belongs-to-drone-other',
        placeholder: 'Or type a drone name',
        value: known ? '' : assigned,
        autocapitalize: 'off'
      });
      other.addEventListener('input', () => {
        item.gimbal = other.value.trim() || select.value;
      });
      return $('div', { class: 'field', 'data-field': 'belongs-to-drone-wrap' }, [
        $('label', { text: 'Belongs to drone' }),
        select,
        $('div', { style: 'height:8px' }),
        other
      ]);
    }

    function renderEditor() {
      const item = state.selected;
      const adding = !!item.isNew;
      const gimbalItem = isGimbalName(item.name);
      const nameInput = $('input', {
        class: 'box',
        placeholder: 'e.g. refly-sf-034, battery 121, or gimbal-sf-034',
        value: item.name || '',
        autocapitalize: 'off'
      });
      nameInput.addEventListener('input', () => {
        item.name = nameInput.value;
        item.type = classify(item.name);
        const picker = document.querySelector('[data-field="belongs-to-drone-wrap"]');
        if (picker) {
          const show = isGimbalName(item.name);
          picker.style.display = show ? '' : 'none';
          if (show) picker.removeAttribute('hidden');
          else picker.setAttribute('hidden', '');
        }
      });
      const person = $('input', { class: 'box', placeholder: 'Your name', value: item.person || '' });
      person.addEventListener('input', () => { item.person = person.value; });
      const note = $('textarea', { placeholder: 'Optional note' });
      note.value = item.note || '';
      note.addEventListener('input', () => { item.note = note.value; });
      const other = $('input', { class: 'box', placeholder: 'Other location', value: state.customLocation });
      other.addEventListener('input', () => {
        state.customLocation = other.value;
        item.location = other.value;
        renderKeepFocus(other);
      });

      return $('div', { class: 'sheet', on: { click: (e) => { if (e.target.classList.contains('sheet')) closeEditor(); } } }, [
        $('div', { class: 'panel' }, [
          $('div', { class: 'grab' }),
          $('div', { class: 'type', text: adding ? 'New' : item.type }),
          adding
            ? $('div', { class: 'field' }, [
                $('label', { text: 'Hardware name' }),
                nameInput
              ])
            : (state.editingName
              ? $('div', { class: 'field' }, [
                  $('label', { text: 'Hardware name' }),
                  nameInput
                ])
              : $('div', { class: 'name-row' }, [
                  $('h2', { text: itemHeading(item) }),
                  $('button', {
                    class: 'btn secondary small',
                    type: 'button',
                    on: { click: () => {
                      state.editingName = true;
                      state.error = '';
                      render();
                      const el = document.querySelector('input[placeholder^="e.g."]');
                      if (el) { el.focus(); el.select(); }
                    } }
                  }, [$('span', { text: 'Edit name' })])
                ])),
          (function () {
            const picker = renderDronePicker(item);
            picker.style.display = gimbalItem ? '' : 'none';
            if (!gimbalItem) picker.setAttribute('hidden', '');
            return picker;
          })(),
          !gimbalItem && !adding && item.gimbal ? $('div', { class: 'sub', text: 'Gimbal: ' + item.gimbal }) : null,
          !gimbalItem && !adding && classify(item.name) === 'drone' && gimbalsForDrone(item.name).length
            ? $('div', { class: 'sub', text: 'Gimbal hardware: ' + gimbalsForDrone(item.name).map((g) => g.name + (g.location ? ' (' + g.location + ')' : '')).join(', ') })
            : null,
          $('div', { class: 'field' }, [
            $('label', { text: 'Location' }),
            $('div', { class: 'locs' }, LOCATIONS.map((loc) =>
              $('button', {
                class: 'loc-btn' + (item.location === loc ? ' on' : ''),
                type: 'button',
                on: { click: () => { item.location = loc; state.customLocation = ''; render(); } }
              }, [$('span', { text: loc })])
            ))
          ]),
          $('div', { class: 'field' }, [
            $('label', { text: 'Other' }),
            other
          ]),
          $('div', { class: 'field' }, [
            $('label', { text: 'Who has it' }),
            person
          ]),
          $('div', { class: 'field' }, [
            $('label', { text: 'Note' }),
            note
          ]),
          $('p', { class: 'err', text: state.error }),
          $('button', {
            class: 'btn',
            disabled: state.loading,
            on: { click: save }
          }, [$('span', { text: state.loading ? 'Saving…' : (adding ? 'Add hardware' : 'Save location') })]),
          !adding ? $('div', { style: 'height:8px' }) : null,
          !adding ? $('button', {
            class: 'btn danger',
            type: 'button',
            disabled: state.loading,
            on: { click: removeItem }
          }, [$('span', { text: 'Delete' })]) : null,
          $('div', { style: 'height:8px' }),
          $('button', { class: 'btn secondary', on: { click: closeEditor } }, [$('span', { text: 'Cancel' })])
        ])
      ]);
    }

    function renderKeepFocus(el) {
      const start = el.selectionStart;
      render();
      const next = document.querySelector('input[placeholder="Other location"]');
      if (next) { next.focus(); next.setSelectionRange(start, start); }
    }

    function render() {
      const root = document.getElementById('app');
      root.replaceChildren();
      if (ssoEnabled() && !hasValidSession()) {
        root.appendChild(renderGate());
        mountGoogleButton();
        if (state.toast) root.appendChild($('div', { class: 'toast', text: state.toast }));
        return;
      }
      root.appendChild(renderList());
      if (state.selected) root.appendChild(renderEditor());
      if (state.toast) root.appendChild($('div', { class: 'toast', text: state.toast }));
    }

    var shareListening = false;
    function bootApp() {
      const bootShared = SHARE && SHARE.read ? SHARE.read() : null;
      if (bootShared && bootShared.items && bootShared.items.length) {
        state.items = visibleItems(bootShared.items);
        state.shared = true;
        render();
      }
      loadItems();
      if (SHARE && SHARE.listen && !shareListening) {
        shareListening = true;
        SHARE.listen(function (items) {
          if (ssoEnabled() && !hasValidSession()) return;
          state.items = visibleItems(items);
          state.shared = true;
          render();
        });
      }
    }

    if (ssoEnabled() && !hasValidSession()) {
      render();
    } else {
      bootApp();
    }
    setInterval(function () {
      if (document.visibilityState !== 'visible') return;
      if (ssoEnabled() && !hasValidSession()) { render(); return; }
      loadItems(null, true);
    }, 8000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      if (ssoEnabled() && !hasValidSession()) { render(); return; }
      loadItems(null, true);
    });
  </script>
</body>
</html>
